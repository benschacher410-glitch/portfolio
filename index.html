<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Portfolio Dashboard</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#2a78d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Portfolio">
<style>
:root{
  --bg:#f5f5f2;--card:#ffffff;--ink:#121211;--ink2:#52514e;--muted:#7a7974;--line:#e6e5e0;--soft:#f0efea;
  --accent:#2a78d6;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#c98500;
  --pos:#0f7b3f;--neg:#c0362c;--warn:#9a6700;--warnbg:#fff6dd;--okbg:#e9f7ef;--badbg:#fdecea;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121211;--card:#1c1c1b;--ink:#f3f2ed;--ink2:#c3c2b7;--muted:#8f8e88;--line:#2f2f2c;--soft:#252523;
  --accent:#5b9ef0;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;
  --pos:#4cc38a;--neg:#ff7a6e;--warn:#e3b341;--warnbg:#2d2614;--okbg:#14261c;--badbg:#2e1715;--shadow:none}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}
/* lock screen */
#lock{min-height:100vh;display:grid;place-items:center;padding:16px}
.lockcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;width:100%;max-width:380px;box-shadow:var(--shadow)}
.lockcard h1{font-size:20px;margin:0 0 4px}.lockcard p{color:var(--ink2);margin:0 0 18px}
.lockcard input[type=password]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.lockcard button{width:100%;margin-top:12px;padding:11px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
.lockcard label{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--ink2);font-size:13px}
#lockerr{color:var(--neg);font-size:13px;min-height:20px;margin-top:8px}
/* layout */
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:12px;padding:12px 0 6px;flex-wrap:wrap}
.top h1{font-size:18px;margin:0;font-weight:700}.tag{font-size:12px;color:var(--ink2);background:var(--soft);border-radius:999px;padding:2px 9px}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px}.pill.ok{background:var(--okbg);color:var(--pos)}.pill.bad{background:var(--warnbg);color:var(--warn)}
.updated{margin-left:auto;color:var(--muted);font-size:12px}
.kill{background:var(--neg);color:#fff!important;padding:6px 13px;border-radius:999px;font-weight:700;font-size:13px;text-decoration:none;white-space:nowrap}
.kill.resume{background:var(--pos)}.kill:hover{filter:brightness(1.08)}
.steps{margin:6px 0 0;padding-left:20px;color:var(--ink2)}.steps li{margin:4px 0}
.banner-stop{background:var(--badbg);color:var(--neg);border-radius:12px;padding:12px 14px;font-weight:650;margin-bottom:14px}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px}
nav button{border:0;background:transparent;padding:7px 12px;border-radius:8px;color:var(--ink2);cursor:pointer;white-space:nowrap;font-weight:500}
nav button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow);border:1px solid var(--line)}
main{padding:16px 0 48px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(12,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}
@media (max-width:900px){.c8,.c6,.c4{grid-column:span 12}.c3{grid-column:span 6}}
@media (max-width:520px){.c3{grid-column:span 12}}
h2{font-size:15px;margin:0 0 10px;font-weight:650}h3{font-size:13px;margin:14px 0 6px;color:var(--ink2);font-weight:600}
.sub{color:var(--muted);font-size:12px}
.kpi .k{color:var(--ink2);font-size:12px}.kpi .v{font-size:24px;font-weight:700;margin-top:2px;letter-spacing:-.01em}
.kpi .d{font-size:12px;margin-top:2px;color:var(--ink2)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.gauge{height:6px;background:var(--soft);border-radius:999px;margin-top:8px;overflow:hidden}.gauge i{display:block;height:100%;background:var(--s1);border-radius:999px}
.gauge.w i{background:var(--warn)}.gauge.b i{background:var(--neg)}
.insights{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.insights li{padding:10px 12px;border-radius:10px;background:var(--soft);display:flex;gap:10px}
.insights li.warn{background:var(--warnbg)}.insights b{flex:none}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.check{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:10px;background:var(--soft);font-size:13px}
.check .dot{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;margin-top:1px}
.check.ok .dot{background:var(--pos)}.check.bad .dot{background:var(--neg)}.check small{display:block;color:var(--muted)}
.seg{display:inline-flex;background:var(--soft);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:6px;cursor:pointer;color:var(--ink2);font-size:12px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row .grow{flex:1}
/* charts */
.chart{position:relative;width:100%}.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .axis text{fill:var(--muted);font-size:11px}.chart .grid line{stroke:var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:6px 0 2px}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.legend i.dash{background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 7px)!important;height:2px}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.12);white-space:nowrap;z-index:3}
.tip .t{color:var(--muted);margin-bottom:3px}.tip div{display:flex;justify-content:space-between;gap:14px}
.bars{display:grid;gap:9px}.bar .lab{display:flex;justify-content:space-between;font-size:13px}
.bar .track{height:10px;background:var(--soft);border-radius:999px;margin-top:4px;overflow:hidden}.bar .track i{display:block;height:100%;border-radius:999px}
/* tables */
.tw{overflow-x:auto;margin:0 -4px}table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;white-space:nowrap;cursor:pointer;user-select:none}th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
th[data-sort]::after{content:" ↕";opacity:.35}th.asc::after{content:" ↑";opacity:1}th.desc::after{content:" ↓";opacity:1}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--soft)}
td.wrap{white-space:normal;min-width:260px;color:var(--ink2)}
.sym{font-weight:700}.badge{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--ink2);margin-left:6px;font-weight:600}
.badge.held{background:var(--okbg);color:var(--pos)}.badge.warn{background:var(--warnbg);color:var(--warn)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;cursor:pointer;font-weight:600;font-size:13px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.chip .dotm{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.stat{background:var(--soft);border-radius:10px;padding:8px 10px}
.stat .k{font-size:11px;color:var(--muted)}.stat .v{font-weight:650;font-variant-numeric:tabular-nums}
.reason{background:var(--soft);border-radius:10px;padding:12px;color:var(--ink2)}
.news{list-style:none;margin:0;padding:0;display:grid;gap:2px}.news li{padding:9px 4px;border-bottom:1px solid var(--line)}
.news a{color:var(--ink);text-decoration:none;font-weight:550}.news a:hover{color:var(--accent);text-decoration:underline}
.news .meta{font-size:12px;color:var(--muted)}a{color:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.filters input,.filters select{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
details{border-top:1px solid var(--line);padding-top:8px;margin-top:10px}summary{cursor:pointer;color:var(--ink2);font-weight:600}
footer{color:var(--muted);font-size:12px;padding:8px 0 32px}.src{display:flex;gap:6px 16px;flex-wrap:wrap}.src .st-stale,.src .st-unavailable{color:var(--warn)}
.empty{color:var(--muted);padding:12px 0}
</style>
</head>
<body>
<section id="lock" class="hidden">
  <form class="lockcard" id="lockform" autocomplete="off">
    <h1>Portfolio dashboard</h1>
    <p>This page is encrypted. Enter your dashboard password.</p>
    <input type="password" id="pw" placeholder="Password" autofocus required>
    <label><input type="checkbox" id="remember"> Remember on this device</label>
    <button type="submit" id="unlock">Unlock</button>
    <div id="lockerr"></div>
  </form>
</section>
<div id="app" class="hidden">
  <header><div class="wrap">
    <div class="top"><h1>Portfolio</h1><span class="tag" id="mode"></span><span class="pill" id="status"></span>
      <span class="updated" id="updated"></span><a id="killbtn" class="kill hidden" target="_blank" rel="noopener noreferrer"></a></div>
    <nav id="tabs"></nav>
  </div></header>
  <main class="wrap" id="view"></main>
  <footer class="wrap" id="foot"></footer>
</div>

/* ---------------- charts ---------------- */
function niceTicks(min, max, n = 5) {
  if (min === max) { min -= 1; max += 1; }
  const step0 = (max - min) / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));

  const out = []; for (let v = Math.ceil(min / step) * step; v <= max + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}
/* series: [{name, color, dash, values:[number|null]}], x: [labels], opts {yFmt, xFmt, refs:[{y,label,color}], height} */
function lineChart(x, series, opts = {}) {

  const box = el("div", {class: "chart"});
  const all = series.flatMap(s => s.values).concat((opts.refs || []).map(r => r.y)).filter(isNum);
  if (x.length < 2 || !all.length) { box.append(el("div", {class: "empty"}, opts.empty || "Not enough data yet.")); return box; }
  let lo = Math.min(...all), hi = Math.max(...all); const pad = (hi - lo || Math.abs(hi) || 1) * 0.06; lo -= pad; hi += pad;
  const ticks = niceTicks(lo, hi), step = ticks.length > 1 ? ticks[1] - ticks[0] : 1;
  lo = Math.min(lo, ticks[0]); hi = Math.max(hi, ticks[ticks.length - 1]);
  const X = i => m.l + i * (W - m.l - m.r) / (x.length - 1), Y = v => m.t + (hi - v) * (H - m.t - m.b) / (hi - lo);
  const s = svg("svg", {viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": opts.label || "chart"});
  const g = svg("g", {class: "grid"}), ax = svg("g", {class: "axis"});
  for (const t of ticks) {
    g.append(svg("line", {x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t)}));
    const tx = svg("text", {x: m.l - 8, y: Y(t) + 4, "text-anchor": "end"}); tx.textContent = (opts.yFmt || num)(t, step); ax.append(tx);
  }
  const nx = Math.min(6, x.length);
  for (let k = 0; k < nx; k++) {
    const i = Math.round(k * (x.length - 1) / Math.max(1, nx - 1));
    const tx = svg("text", {x: X(i), y: H - 6, "text-anchor": k === 0 ? "start" : k === nx - 1 ? "end" : "middle"});
    tx.textContent = (opts.xFmt || (v => v))(x[i]); ax.append(tx);
  }
  s.append(g, ax);
  for (const r of opts.refs || []) {
    if (!isNum(r.y)) continue;
    s.append(svg("line", {x1: m.l, x2: W - m.r, y1: Y(r.y), y2: Y(r.y), stroke: r.color, "stroke-width": 1.5, "stroke-dasharray": "5 4"}));
  }
  for (const se of series) {
    let d = "", pen = false;
    se.values.forEach((v, i) => { if (!isNum(v)) { pen = false; return; } d += (pen ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1); pen = true; });
    s.append(svg("path", {d, fill: "none", stroke: se.color, "stroke-width": se.width || 2, "stroke-linejoin": "round", "stroke-linecap": "round", "stroke-dasharray": se.dash ? "6 4" : ""}));
  }
  const cross = svg("line", {y1: m.t, y2: H - m.b, stroke: css("--muted"), "stroke-width": 1, opacity: 0});
  const dots = series.map(se => { const c = svg("circle", {r: 4.5, fill: se.color, stroke: css("--card"), "stroke-width": 2, opacity: 0}); return c; });
  s.append(cross, ...dots);
  const hit = svg("rect", {x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: "transparent"}); s.append(hit);
  const tip = el("div", {class: "tip hidden"});
  function move(ev) {
    const rect = s.getBoundingClientRect(), px = (ev.clientX - rect.left) * W / rect.width;
    const i = Math.max(0, Math.min(x.length - 1, Math.round((px - m.l) * (x.length - 1) / (W - m.l - m.r))));
    cross.setAttribute("x1", X(i)); cross.setAttribute("x2", X(i)); cross.setAttribute("opacity", 1);
    tip.replaceChildren(el("div", {class: "t"}, (opts.tipX || opts.xFmt || (v => v))(x[i])));
    series.forEach((se, k) => {
      const v = se.values[i];
      if (isNum(v)) { dots[k].setAttribute("cx", X(i)); dots[k].setAttribute("cy", Y(v)); dots[k].setAttribute("opacity", 1); }
      else dots[k].setAttribute("opacity", 0);
      tip.append(el("div", {}, el("span", {style: `color:${se.color}`}, "● " + se.name), el("b", {}, isNum(v) ? (opts.tipFmt || opts.yFmt || num)(v) : "–")));
    });
    tip.classList.remove("hidden");
    const left = X(i) * rect.width / W, tw = tip.offsetWidth;
    tip.style.left = Math.max(0, Math.min(rect.width - tw, left + 12 > rect.width - tw ? left - tw - 12 : left + 12)) + "px";
    tip.style.top = (legend.offsetHeight + 12) + "px";

  hit.addEventListener("pointermove", move); hit.addEventListener("pointerdown", move); hit.addEventListener("pointerleave", leave);
  const legend = el("div", {class: "legend"}, series.map(se => el("span", {}, el("i", {class: se.dash ? "dash" : "", style: `background:${se.color};color:${se.color}`}), se.name)),
    (opts.refs || []).filter(r => isNum(r.y)).map(r => el("span", {}, el("i", {class: "dash", style: `color:${r.color}`}), r.label)));

}
function bars(items, fmt, colors) {

    el("div", {class: "lab"}, el("span", {}, it.label), el("b", {}, fmt(it.value))),

/* cols: [{key,label,num,fmt(row)->node|string,sort(row)->value,wrap}] */
function table(cols, rows, opts = {}) {
  if (!rows.length) return el("div", {class: "empty"}, opts.empty || "Nothing yet.");
  let sortKey = opts.sort || null, dir = opts.dir || -1;
  const tbody = el("tbody"), thead = el("thead"), t = el("table", {}, thead, tbody);
  const ths = cols.map(c => el("th", {class: c.num ? "num" : "", "data-sort": c.sort || c.key ? "1" : null, on: {click: () => { dir = sortKey === c.key ? -dir : -1; sortKey = c.key; draw(); }}}, c.label));
  thead.append(el("tr", {}, ths));
  function draw() {
    const col = cols.find(c => c.key === sortKey);
    const sorted = col ? [...rows].sort((a, b) => { const va = col.sort ? col.sort(a) : a[col.key], vb = col.sort ? col.sort(b) : b[col.key];
      return (va == null) - (vb == null) || (va < vb ? -1 : va > vb ? 1 : 0) * dir; }) : rows;
    ths.forEach((th, i) => { th.classList.toggle("asc", cols[i].key === sortKey && dir === 1); th.classList.toggle("desc", cols[i].key === sortKey && dir === -1); });
    tbody.replaceChildren(...sorted.map(r => el("tr", {class: opts.onRow ? "click" : "", on: opts.onRow ? {click: () => opts.onRow(r)} : null},
      cols.map(c => { const v = c.fmt ? c.fmt(r) : r[c.key]; return el("td", {class: (c.num ? "num " : "") + (c.wrap ? "wrap" : "")}, v == null ? "–" : v); }))));
  }

}

function heatmap(c) {
  const n = c.symbols.length, cell = 46, pad = 54, W = pad + n * cell, H = pad + n * cell;
  const s = svg("svg", {viewBox: `0 0 ${W} ${H}`, style: `max-width:${W}px`});
  const tip = el("div", {class: "tip hidden"}), box = el("div", {class: "chart"});
  const shade = v => { const a = Math.min(1, Math.abs(v)); return v >= 0 ? `rgba(192,54,44,${0.12 + a * 0.75})` : `rgba(42,120,214,${0.12 + a * 0.75})`; };
  c.symbols.forEach((sym, i) => {
    const tl = svg("text", {x: pad - 6, y: pad + i * cell + cell / 2 + 4, "text-anchor": "end", "font-size": 11, fill: css("--ink2")}); tl.textContent = sym; s.append(tl);
    const tt = svg("text", {x: pad + i * cell + cell / 2, y: pad - 8, "text-anchor": "middle", "font-size": 11, fill: css("--ink2")}); tt.textContent = sym; s.append(tt);
    c.symbols.forEach((sym2, j) => {
      const v = c.matrix[i][j];
      const r = svg("rect", {x: pad + j * cell + 1, y: pad + i * cell + 1, width: cell - 2, height: cell - 2, rx: 6, fill: i === j ? css("--soft") : shade(v)});
      r.addEventListener("pointermove", ev => { const b = box.getBoundingClientRect(); tip.replaceChildren(el("div", {class: "t"}, `${sym} vs ${sym2}`), el("b", {}, v.toFixed(2)));
        tip.classList.remove("hidden"); tip.style.left = (ev.clientX - b.left + 12) + "px"; tip.style.top = (ev.clientY - b.top + 12) + "px"; });
      r.addEventListener("pointerleave", () => tip.classList.add("hidden"));
      s.append(r);
      if (i !== j) { const tx = svg("text", {x: pad + j * cell + cell / 2, y: pad + i * cell + cell / 2 + 4, "text-anchor": "middle", "font-size": 11, fill: css("--ink"), "pointer-events": "none"}); tx.textContent = v.toFixed(2); s.append(tx); }
    });
  });
  box.append(s, tip); return box;
}

  sel.addEventListener("change", draw); draw();
  return el("div", {class: "grid"}, card("c12", "Activity", el("div", {class: "sub", style: "margin-bottom:8px"}, "Every bot run, order, alert and risk event, newest first. Same events as your Discord alerts, kept permanently."),
    el("div", {class: "filters"}, el("span", {class: "sub"}, "Show:"), sel), box));
}

function show(tab) {
  current = tab;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  document.getElementById("view").replaceChildren({overview, stocks, risk, journal, trades, activity, market, research}[tab]());
  window.scrollTo({top: 0});
}

function start() {
  document.getElementById("lock").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("mode").textContent = (D.paper ? "PAPER" : "LIVE") + " · " + D.strategy;
  const warnN = D.checks.filter(c => !c.ok).length, st = document.getElementById("status");
  st.textContent = warnN ? `${warnN} warning${warnN > 1 ? "s" : ""}` : "All checks OK"; st.className = "pill " + (warnN ? "bad" : "ok");
  document.getElementById("updated").textContent = `Updated ${fmtTime(D.built_at)} · prices to ${fmtDate(D.bar_date)}`;
  const ks = D.kill_switch || {}, kb = document.getElementById("killbtn");
  if (ks.url && /^https:\/\/github\.com\//.test(ks.url)) {
    kb.href = ks.url; kb.textContent = ks.active ? "▶️ Resume trading" : "🛑 Stop all trading";
    kb.classList.toggle("resume", !!ks.active); kb.classList.remove("hidden");
  }
  if (ks.active) { st.textContent = "TRADING STOPPED"; st.className = "pill bad"; }
  document.getElementById("tabs").replaceChildren(...TABS.map(([k, l]) => el("button", {"data-tab": k, on: {click: () => show(k)}}, l)));
  const R = D.research;
  document.getElementById("foot").replaceChildren(el("div", {class: "src"}, el("span", {}, "Prices: Alpaca (SIP daily bars)"),
    Object.values(R).map(r => el("span", {class: "st-" + r.status}, `${r.source}: ${r.status === "fresh" ? "up to date" : r.status} (${fmtTime(r.fetched_at)})`))),
    el("p", {}, "Paper trading only. Research is for your information and does not influence the bot’s trades. This page shows data and the bot’s own reasoning; it is not financial advice."));
  show(current);
}
boot();
</script>
</body>
</html>
